<div *ngIf="isOpen$ | async" 
  class="fixed inset-0 z-50 flex items-start justify-center pt-20 px-4 bg-slate-950/75 backdrop-blur-md animate-fade-in select-none"
  (click)="onClose()">
  
  <div 
    class="relative w-full max-w-xl flex flex-col rounded-3xl border shadow-2xl overflow-hidden animate-slide-down"
    (click)="$event.stopPropagation()"
    [ngClass]="darkMode ? 'bg-slate-900 border-slate-700/80 text-white shadow-black/80' : 'bg-white border-slate-200 text-slate-900 shadow-slate-300/80'">
    
    <!-- Search Input Bar -->
    <div class="p-4 border-b flex items-center space-x-3 shrink-0"
      [ngClass]="darkMode ? 'border-slate-800' : 'border-slate-100'">
      <i nz-icon nzType="search" nzTheme="outline" class="text-slate-400 text-lg"></i>
      <input 
        type="text" 
        [(ngModel)]="searchQuery" 
        placeholder="Type a command or search tools (e.g. Text, Rotate, Export)..." 
        autofocus
        class="w-full text-sm font-medium bg-transparent border-0 focus:outline-none placeholder-slate-400" />
      <kbd class="px-2 py-0.5 text-[10px] font-mono rounded bg-slate-200 dark:bg-slate-800 text-slate-500 border border-slate-300 dark:border-slate-700">ESC</kbd>
    </div>

    <!-- Commands List -->
    <div class="max-h-80 overflow-y-auto p-2 space-y-1 scrollbar-thin">
      <div *ngIf="filteredCommands.length === 0" class="p-8 text-center text-xs text-slate-400">
        No commands found matching "{{ searchQuery }}"
      </div>

      <button
        *ngFor="let cmd of filteredCommands; let idx = index"
        (click)="onExecute(cmd)"
        (mouseenter)="selectedIndex = idx"
        class="w-full px-3.5 py-2.5 rounded-2xl flex items-center justify-between transition-colors text-left"
        [ngClass]="selectedIndex === idx 
          ? 'bg-indigo-600 text-white shadow-sm' 
          : (darkMode ? 'hover:bg-slate-800/80 text-slate-200' : 'hover:bg-slate-100 text-slate-700')">
        
        <div class="flex items-center space-x-3">
          <div class="w-7 h-7 rounded-xl flex items-center justify-center text-sm"
            [ngClass]="selectedIndex === idx ? 'bg-white/20 text-white' : 'bg-indigo-500/10 text-indigo-500'">
            <i nz-icon [nzType]="cmd.icon" nzTheme="outline"></i>
          </div>
          <span class="text-xs font-semibold">{{ cmd.title }}</span>
        </div>

        <div class="flex items-center space-x-2">
          <span class="text-[10px] font-medium opacity-60 uppercase">{{ cmd.category }}</span>
          <kbd *ngIf="cmd.shortcut" 
            class="px-1.5 py-0.5 text-[10px] font-mono rounded"
            [ngClass]="selectedIndex === idx ? 'bg-white/20 text-white' : 'bg-slate-200 dark:bg-slate-800 text-slate-500'">
            {{ cmd.shortcut }}
          </kbd>
        </div>
      </button>
    </div>

    <!-- Palette Footer -->
    <div class="h-10 px-4 flex items-center justify-between text-[11px] text-slate-400 border-t shrink-0 font-medium"
      [ngClass]="darkMode ? 'border-slate-800 bg-slate-900/50' : 'border-slate-100 bg-slate-50/50'">
      <div class="flex items-center space-x-3">
        <span><kbd class="font-mono">↑↓</kbd> Navigate</span>
        <span><kbd class="font-mono">↵</kbd> Select</span>
      </div>
      <span>PDF Studio Command Palette</span>
    </div>

  </div>
</div>
