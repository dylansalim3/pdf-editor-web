<div *ngIf="isOpen$ | async" 
  class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 md:p-10 bg-slate-950/75 backdrop-blur-md animate-fade-in select-none">
  
  <div class="relative w-full max-w-6xl h-[90vh] flex flex-col rounded-3xl border shadow-2xl overflow-hidden"
    [ngClass]="darkMode ? 'bg-slate-900 border-slate-800 text-white shadow-black/60' : 'bg-white border-slate-200 text-slate-900 shadow-slate-300/60'">
    
    <!-- Modal Header -->
    <div class="h-16 px-6 flex items-center justify-between border-b shrink-0"
      [ngClass]="darkMode ? 'border-slate-800 bg-slate-900/50' : 'border-slate-100 bg-slate-50/50'">
      
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-2xl bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 flex items-center justify-center">
          <i nz-icon nzType="appstore" nzTheme="outline" class="text-lg"></i>
        </div>
        <div>
          <h2 class="text-sm font-bold tracking-tight">Organize & Manage Pages</h2>
          <p class="text-xs text-slate-500 dark:text-slate-400">Drag to reorder, select to rotate, duplicate, or delete</p>
        </div>
      </div>

      <!-- Close Button -->
      <button 
        (click)="onClose()"
        class="p-2 rounded-xl text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
        <i nz-icon nzType="close" nzTheme="outline" class="text-base"></i>
      </button>
    </div>

    <!-- Batch Actions Bar -->
    <div class="px-6 py-3 border-b flex flex-wrap items-center justify-between gap-3 shrink-0"
      [ngClass]="darkMode ? 'bg-slate-800/40 border-slate-800' : 'bg-slate-100/60 border-slate-200'">
      
      <!-- Selection Controls -->
      <div class="flex items-center space-x-2">
        <button 
          (click)="selectAll()"
          class="px-3 py-1.5 text-xs font-semibold rounded-xl border transition-colors"
          [ngClass]="selectedPages.size > 0 ? 'bg-indigo-600 text-white border-indigo-600' : (darkMode ? 'bg-slate-800 border-slate-700 text-slate-300' : 'bg-white border-slate-200 text-slate-700')">
          {{ selectedPages.size === (pageOrder$ | async)?.length ? 'Deselect All' : 'Select All (' + ((pageOrder$ | async)?.length || 0) + ')' }}
        </button>

        <span *ngIf="selectedPages.size > 0" class="text-xs font-mono font-bold text-indigo-600 dark:text-indigo-400 pl-1">
          {{ selectedPages.size }} selected
        </span>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center space-x-2">
        <!-- Rotate 90 CW -->
        <button 
          (click)="onRotateSelected(90)"
          class="px-3 py-1.5 text-xs font-semibold rounded-xl border transition-colors flex items-center gap-1.5"
          [ngClass]="darkMode ? 'bg-slate-800 border-slate-700 text-slate-200 hover:bg-slate-700' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'">
          <i nz-icon nzType="rotate-right" nzTheme="outline"></i>
          <span>Rotate 90°</span>
        </button>

        <!-- Rotate 180 -->
        <button 
          (click)="onRotateSelected(180)"
          class="px-3 py-1.5 text-xs font-semibold rounded-xl border transition-colors flex items-center gap-1.5"
          [ngClass]="darkMode ? 'bg-slate-800 border-slate-700 text-slate-200 hover:bg-slate-700' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'">
          <i nz-icon nzType="redo" nzTheme="outline"></i>
          <span>Rotate 180°</span>
        </button>

        <!-- Duplicate -->
        <button 
          (click)="onDuplicateSelected()"
          [disabled]="selectedPages.size === 0"
          class="px-3 py-1.5 text-xs font-semibold rounded-xl border transition-colors disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1.5"
          [ngClass]="darkMode ? 'bg-slate-800 border-slate-700 text-slate-200 hover:bg-slate-700' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'">
          <i nz-icon nzType="copy" nzTheme="outline"></i>
          <span>Duplicate</span>
        </button>

        <!-- Delete Selected -->
        <button 
          (click)="onDeleteSelected()"
          [disabled]="selectedPages.size === 0"
          class="px-3 py-1.5 text-xs font-bold rounded-xl text-rose-600 bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/40 dark:text-rose-400 dark:hover:bg-rose-900/40 disabled:opacity-40 disabled:cursor-not-allowed transition-colors flex items-center gap-1.5">
          <i nz-icon nzType="delete" nzTheme="outline"></i>
          <span>Delete</span>
        </button>

        <div class="w-px h-5 mx-1" [ngClass]="darkMode ? 'bg-slate-700' : 'bg-slate-300'"></div>

        <!-- Add Blank Page -->
        <button 
          (click)="onAddBlankPage()"
          class="px-3 py-1.5 text-xs font-semibold rounded-xl bg-indigo-50 text-indigo-600 dark:bg-indigo-950/40 dark:text-indigo-400 hover:bg-indigo-100 transition-colors flex items-center gap-1.5">
          <i nz-icon nzType="plus" nzTheme="outline"></i>
          <span>Add Blank Page</span>
        </button>
      </div>
    </div>

    <!-- Grid Container -->
    <div 
      cdkDropList
      [cdkDropListData]="(pageOrder$ | async) || []"
      (cdkDropListDropped)="onDrop($event)"
      class="flex-1 overflow-y-auto p-6 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6 scrollbar-thin">
      
      <div 
        *ngFor="let page of pageOrder$ | async; let idx = index"
        cdkDrag
        (click)="toggleSelect(idx, $event)"
        class="group relative flex flex-col rounded-2xl border-2 p-2.5 cursor-pointer transition-all duration-150 hover:shadow-lg"
        [ngClass]="selectedPages.has(idx) 
          ? 'border-indigo-600 bg-indigo-50/40 dark:bg-indigo-950/40 shadow-sm ring-2 ring-indigo-500/20' 
          : (darkMode ? 'border-slate-800 bg-slate-800/60 hover:border-slate-700' : 'border-slate-200 bg-slate-50/60 hover:border-slate-300')">
        
        <!-- Header Strip: Checkbox & Number -->
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center space-x-2">
            <input 
              type="checkbox"
              [checked]="selectedPages.has(idx)"
              (click)="$event.stopPropagation(); toggleSelect(idx)"
              class="w-4 h-4 rounded text-indigo-600 border-slate-300 focus:ring-indigo-500 cursor-pointer" />
            <span class="text-xs font-bold text-slate-700 dark:text-slate-300">Page {{ idx + 1 }}</span>
          </div>

          <span *ngIf="page.rotation !== 0" class="text-[9px] font-mono font-semibold px-1 rounded bg-amber-500/10 text-amber-600 dark:text-amber-400">
            {{ page.rotation }}°
          </span>
        </div>

        <!-- Thumbnail Preview Box -->
        <div class="relative w-full aspect-[1/1.3] rounded-xl overflow-hidden flex items-center justify-center border transition-all"
          [ngClass]="darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'">
          
          <img 
            *ngIf="!page.isBlank && thumbnails.get(page.originalIndex) as thumbUrl; else blankGridThumb"
            [src]="thumbUrl"
            [style.transform]="'rotate(' + page.rotation + 'deg)'"
            alt="Page"
            class="max-w-full max-h-full object-contain pointer-events-none transition-transform duration-200 shadow-xs" />

          <ng-template #blankGridThumb>
            <div class="flex flex-col items-center justify-center text-slate-400">
              <i nz-icon nzType="file-text" nzTheme="outline" class="text-3xl mb-1 text-slate-300 dark:text-slate-600"></i>
              <span class="text-[10px] font-medium text-slate-400">Blank Page</span>
            </div>
          </ng-template>

          <!-- Jump To Page Button Overlay on Double Click / Hover -->
          <div class="absolute inset-0 bg-slate-900/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-xs">
            <button 
              (click)="onSelectAndClose(idx)"
              class="px-3 py-1.5 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-500 rounded-xl shadow-md transition-colors">
              Open Page
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Footer -->
    <div class="h-16 px-6 flex items-center justify-between border-t shrink-0"
      [ngClass]="darkMode ? 'border-slate-800 bg-slate-900/50' : 'border-slate-100 bg-slate-50/50'">
      <span class="text-xs text-slate-500 dark:text-slate-400 font-medium">
        Total: {{ (pageOrder$ | async)?.length || 0 }} pages in document
      </span>

      <button 
        (click)="onClose()"
        class="btn-primary px-5 py-2 text-xs font-bold rounded-xl">
        Done Organizing
      </button>
    </div>
  </div>
</div>
