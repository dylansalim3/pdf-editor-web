<aside class="h-full flex flex-col border-r transition-all duration-300 relative select-none shrink-0"
  [class.w-56]="!collapsed"
  [class.w-12]="collapsed"
  [ngClass]="darkMode ? 'bg-slate-900 border-slate-800 text-slate-200' : 'bg-slate-50 border-slate-200 text-slate-800'">

  <!-- Sidebar Header -->
  <div class="h-12 px-3 flex items-center justify-between border-b shrink-0"
    [ngClass]="darkMode ? 'border-slate-800' : 'border-slate-200'">
    <div *ngIf="!collapsed" class="flex items-center space-x-2">
      <span class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Pages</span>
      <span class="px-1.5 py-0.5 text-[10px] font-mono rounded bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400">
        {{ (pageOrder$ | async)?.length || 0 }}
      </span>
    </div>

    <!-- Toggle Collapse Button -->
    <button 
      (click)="toggleCollapse()"
      class="p-1 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors mx-auto"
      [title]="collapsed ? 'Expand Thumbnails' : 'Collapse Thumbnails'">
      <i nz-icon [nzType]="collapsed ? 'right' : 'left'" nzTheme="outline" class="text-xs"></i>
    </button>
  </div>

  <!-- Thumbnails Drag List -->
  <div *ngIf="!collapsed" 
    cdkDropList 
    (cdkDropListDropped)="onDrop($event)"
    class="flex-1 overflow-y-auto p-3 space-y-4 scrollbar-thin">
    
    <ng-container *ngFor="let page of pageOrder$ | async; let idx = index">
      <div 
        cdkDrag
        (click)="onSelectPage(idx)"
        class="group relative rounded-xl border-2 p-2 cursor-pointer transition-all duration-200 hover:shadow-md"
        [ngClass]="(activePageIndex$ | async) === idx 
          ? 'border-indigo-600 bg-indigo-50/40 dark:bg-indigo-950/40 shadow-sm ring-2 ring-indigo-500/20' 
          : (darkMode ? 'border-slate-800 bg-slate-800/60 hover:border-slate-700' : 'border-slate-200 bg-white hover:border-slate-300')">
        
        <!-- Drag Handle & Page Number Indicator -->
        <div class="flex items-center justify-between mb-1.5">
          <div class="flex items-center space-x-1.5 text-xs font-bold"
            [class.text-indigo-600]="(activePageIndex$ | async) === idx"
            [class.text-slate-500]="(activePageIndex$ | async) !== idx">
            <span class="cursor-grab active:cursor-grabbing text-slate-400 group-hover:text-indigo-500" cdkDragHandle title="Drag to reorder">
              <i nz-icon nzType="drag" nzTheme="outline" class="text-xs"></i>
            </span>
            <span>Page {{ idx + 1 }}</span>
          </div>

          <!-- Rotation Indicator -->
          <span *ngIf="page.rotation !== 0" class="text-[9px] font-mono font-semibold px-1 rounded bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20">
            {{ page.rotation }}°
          </span>
        </div>

        <!-- Thumbnail Image Container -->
        <div class="relative w-full aspect-[1/1.3] rounded-lg overflow-hidden flex items-center justify-center border transition-all duration-200"
          [ngClass]="darkMode ? 'bg-slate-900 border-slate-800' : 'bg-slate-100 border-slate-200'">
          
          <!-- Image preview with dynamic CSS rotation -->
          <img 
            *ngIf="!page.isBlank && thumbnails.get(page.originalIndex) as thumbUrl; else blankThumb"
            [src]="thumbUrl"
            [style.transform]="'rotate(' + page.rotation + 'deg)'"
            alt="Page Thumbnail"
            class="max-w-full max-h-full object-contain shadow-xs transition-transform duration-200 pointer-events-none" />

          <ng-template #blankThumb>
            <div class="flex flex-col items-center justify-center text-slate-400">
              <i nz-icon nzType="file-text" nzTheme="outline" class="text-2xl mb-1"></i>
              <span class="text-[10px] font-medium">Blank Page</span>
            </div>
          </ng-template>

          <!-- Hover Action Overlay Bar -->
          <div class="absolute inset-x-0 bottom-0 p-1.5 bg-gradient-to-t from-slate-950/80 via-slate-900/60 to-transparent flex items-center justify-center space-x-1 opacity-0 group-hover:opacity-100 transition-opacity duration-150 backdrop-blur-xs">
            <!-- Rotate Left -->
            <button 
              (click)="onRotateLeft(idx, $event)"
              class="p-1 rounded-md text-white hover:bg-white/20 transition-colors"
              title="Rotate Left 90°">
              <i nz-icon nzType="rotate-left" nzTheme="outline" class="text-xs"></i>
            </button>
            
            <!-- Rotate Right -->
            <button 
              (click)="onRotateRight(idx, $event)"
              class="p-1 rounded-md text-white hover:bg-white/20 transition-colors"
              title="Rotate Right 90°">
              <i nz-icon nzType="rotate-right" nzTheme="outline" class="text-xs"></i>
            </button>

            <!-- Duplicate -->
            <button 
              (click)="onDuplicate(idx, $event)"
              class="p-1 rounded-md text-white hover:bg-white/20 transition-colors"
              title="Duplicate Page">
              <i nz-icon nzType="copy" nzTheme="outline" class="text-xs"></i>
            </button>

            <!-- Delete -->
            <button 
              (click)="onDelete(idx, $event)"
              class="p-1 rounded-md text-rose-400 hover:bg-rose-500 hover:text-white transition-colors"
              title="Delete Page">
              <i nz-icon nzType="delete" nzTheme="outline" class="text-xs"></i>
            </button>
          </div>
        </div>
      </div>
    </ng-container>
  </div>

  <!-- Sidebar Footer Action Buttons -->
  <div *ngIf="!collapsed" class="p-3 border-t space-y-2 shrink-0"
    [ngClass]="darkMode ? 'border-slate-800 bg-slate-900' : 'border-slate-200 bg-slate-50'">
    
    <button 
      (click)="onAddBlankPage()"
      class="w-full py-1.5 px-3 text-xs font-semibold rounded-xl border border-dashed flex items-center justify-center gap-1.5 transition-colors"
      [ngClass]="darkMode ? 'border-slate-700 text-slate-300 hover:border-indigo-500 hover:text-indigo-400' : 'border-slate-300 text-slate-700 hover:border-indigo-600 hover:text-indigo-600'">
      <i nz-icon nzType="plus" nzTheme="outline" class="text-xs"></i>
      <span>Add Blank Page</span>
    </button>

    <button 
      (click)="onOpenOrganize()"
      class="w-full py-1.5 px-3 text-xs font-semibold rounded-xl flex items-center justify-center gap-1.5 transition-colors"
      [ngClass]="darkMode ? 'bg-slate-800 hover:bg-slate-700 text-white' : 'bg-slate-200 hover:bg-slate-300 text-slate-800'">
      <i nz-icon nzType="appstore" nzTheme="outline" class="text-xs"></i>
      <span>Page Manager Grid</span>
    </button>
  </div>
</aside>
