<aside class="w-64 h-full border-l flex flex-col transition-colors duration-200 select-none shrink-0"
  [ngClass]="darkMode ? 'bg-slate-900 border-slate-800 text-slate-200' : 'bg-slate-50 border-slate-200 text-slate-800'">
  
  <!-- Header -->
  <div class="h-12 px-4 flex items-center justify-between border-b shrink-0"
    [ngClass]="darkMode ? 'border-slate-800' : 'border-slate-200'">
    <div class="flex items-center space-x-2">
      <i nz-icon nzType="control" nzTheme="outline" class="text-indigo-500 text-sm"></i>
      <span class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Properties</span>
    </div>

    <span *ngIf="selectedAnnotation$ | async as sel" class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 uppercase">
      {{ sel.type }}
    </span>
  </div>

  <!-- Inspector Content Body -->
  <div class="flex-1 overflow-y-auto p-4 space-y-6 scrollbar-thin" *ngIf="inspectorProperties$ | async as props">
    
    <!-- Color Palette Section -->
    <div class="space-y-2">
      <label class="text-xs font-bold text-slate-600 dark:text-slate-400">Color</label>
      <div class="grid grid-cols-4 gap-2">
        <button
          *ngFor="let color of colorPresets"
          (click)="onColorChange(color)"
          class="w-full aspect-square rounded-xl border-2 transition-all hover:scale-105"
          [style.backgroundColor]="color"
          [ngClass]="props.color === color ? 'border-indigo-600 ring-2 ring-indigo-500/30' : (color === '#ffffff' ? 'border-slate-300' : 'border-transparent')">
        </button>
      </div>
      
      <!-- Custom Color Input -->
      <div class="flex items-center space-x-2 pt-1">
        <input 
          type="color" 
          [value]="props.color" 
          (input)="onColorChange($any($event.target).value)" 
          class="w-7 h-7 rounded-lg cursor-pointer border-0 p-0 bg-transparent" />
        <span class="text-xs font-mono font-medium text-slate-500">{{ props.color }}</span>
      </div>
    </div>

    <!-- Stroke Thickness Slider -->
    <div class="space-y-2" *ngIf="['draw', 'highlight', 'rectangle', 'circle'].includes((activeTool$ | async) || '') || (selectedAnnotation$ | async)?.type === 'rectangle' || (selectedAnnotation$ | async)?.type === 'circle'">
      <div class="flex justify-between items-center text-xs font-bold text-slate-600 dark:text-slate-400">
        <span>Stroke Width</span>
        <span class="font-mono text-indigo-600 dark:text-indigo-400">{{ props.strokeWidth }}px</span>
      </div>
      <input 
        type="range" 
        min="1" 
        max="24" 
        [value]="props.strokeWidth"
        (input)="onStrokeChange(+$any($event.target).value)"
        class="w-full h-1.5 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-600" />
    </div>

    <!-- Font Size & Family Section -->
    <div class="space-y-3" *ngIf="(activeTool$ | async) === 'text' || (selectedAnnotation$ | async)?.type === 'text' || (activeTool$ | async) === 'watermark' || (selectedAnnotation$ | async)?.type === 'watermark'">
      <div class="flex justify-between items-center text-xs font-bold text-slate-600 dark:text-slate-400">
        <span>Font Size</span>
        <span class="font-mono text-indigo-600 dark:text-indigo-400">{{ props.fontSize }}px</span>
      </div>
      <input 
        type="range" 
        min="10" 
        max="72" 
        [value]="props.fontSize"
        (input)="onFontSizeChange(+$any($event.target).value)"
        class="w-full h-1.5 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-600" />

      <div class="space-y-1 pt-1">
        <label class="text-xs font-bold text-slate-600 dark:text-slate-400">Font Family</label>
        <select 
          [value]="props.fontFamily"
          (change)="onFontFamilyChange($any($event.target).value)"
          class="w-full p-2 text-xs rounded-xl border bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
          <option *ngFor="let font of fontFamilies" [value]="font">{{ font }}</option>
        </select>
      </div>
    </div>

    <!-- Watermark Customization -->
    <div class="space-y-3" *ngIf="(activeTool$ | async) === 'watermark' || (selectedAnnotation$ | async)?.type === 'watermark'">
      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-600 dark:text-slate-400">Watermark Text</label>
        <input 
          type="text" 
          [value]="props.watermarkText"
          (input)="onWatermarkTextChange($any($event.target).value)"
          placeholder="CONFIDENTIAL"
          class="w-full p-2 text-xs rounded-xl border bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/20" />
      </div>

      <div class="flex justify-between items-center text-xs font-bold text-slate-600 dark:text-slate-400">
        <span>Rotation Angle</span>
        <span class="font-mono text-indigo-600 dark:text-indigo-400">{{ props.watermarkAngle }}°</span>
      </div>
      <input 
        type="range" 
        min="-90" 
        max="90" 
        [value]="props.watermarkAngle"
        (input)="onWatermarkAngleChange(+$any($event.target).value)"
        class="w-full h-1.5 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-600" />
    </div>

    <!-- Opacity Slider -->
    <div class="space-y-2">
      <div class="flex justify-between items-center text-xs font-bold text-slate-600 dark:text-slate-400">
        <span>Opacity</span>
        <span class="font-mono text-indigo-600 dark:text-indigo-400">{{ (props.opacity * 100) | number:'1.0-0' }}%</span>
      </div>
      <input 
        type="range" 
        min="0.1" 
        max="1" 
        step="0.05"
        [value]="props.opacity"
        (input)="onOpacityChange(+$any($event.target).value)"
        class="w-full h-1.5 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-600" />
    </div>

    <!-- Selected Element Actions -->
    <div *ngIf="selectedAnnotation$ | async" class="pt-4 border-t space-y-2"
      [ngClass]="darkMode ? 'border-slate-800' : 'border-slate-200'">
      <button 
        (click)="onDeleteSelected()"
        class="w-full py-2 px-3 text-xs font-bold text-rose-600 bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/40 dark:text-rose-400 dark:hover:bg-rose-900/40 rounded-xl transition-colors flex items-center justify-center gap-1.5">
        <i nz-icon nzType="delete" nzTheme="outline"></i>
        <span>Delete Selected</span>
      </button>

      <button 
        (click)="onDeselect()"
        class="w-full py-1.5 px-3 text-xs font-medium text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 rounded-xl transition-colors">
        Deselect
      </button>
    </div>

  </div>
</aside>
