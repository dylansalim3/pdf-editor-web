<div *ngIf="isOpen$ | async" 
  class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-slate-950/75 backdrop-blur-md animate-fade-in select-none">
  
  <div class="relative w-full max-w-lg flex flex-col rounded-3xl border shadow-2xl overflow-hidden"
    [ngClass]="darkMode ? 'bg-slate-900 border-slate-800 text-white shadow-black/60' : 'bg-white border-slate-200 text-slate-900 shadow-slate-300/60'">
    
    <!-- Modal Header -->
    <div class="h-14 px-6 flex items-center justify-between border-b shrink-0"
      [ngClass]="darkMode ? 'border-slate-800' : 'border-slate-100'">
      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 rounded-xl bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 flex items-center justify-center">
          <i nz-icon nzType="form" nzTheme="outline" class="text-base"></i>
        </div>
        <h2 class="text-sm font-bold tracking-tight">Create Signature</h2>
      </div>

      <button 
        (click)="onClose()"
        class="p-1.5 rounded-xl text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
        <i nz-icon nzType="close" nzTheme="outline" class="text-sm"></i>
      </button>
    </div>

    <!-- Tabs Navigation -->
    <div class="px-6 pt-4">
      <div class="flex p-1 rounded-2xl border"
        [ngClass]="darkMode ? 'bg-slate-800/80 border-slate-700' : 'bg-slate-100 border-slate-200'">
        
        <button 
          (click)="setTab('draw')"
          class="flex-1 py-1.5 text-xs font-bold rounded-xl transition-all flex items-center justify-center gap-1.5"
          [ngClass]="activeTab === 'draw' ? 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-400 shadow-xs' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'">
          <i nz-icon nzType="edit" nzTheme="outline"></i>
          <span>Draw</span>
        </button>

        <button 
          (click)="setTab('type')"
          class="flex-1 py-1.5 text-xs font-bold rounded-xl transition-all flex items-center justify-center gap-1.5"
          [ngClass]="activeTab === 'type' ? 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-400 shadow-xs' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'">
          <i nz-icon nzType="font-size" nzTheme="outline"></i>
          <span>Type</span>
        </button>

        <button 
          (click)="setTab('upload')"
          class="flex-1 py-1.5 text-xs font-bold rounded-xl transition-all flex items-center justify-center gap-1.5"
          [ngClass]="activeTab === 'upload' ? 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-400 shadow-xs' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'">
          <i nz-icon nzType="upload" nzTheme="outline"></i>
          <span>Upload</span>
        </button>
      </div>
    </div>

    <!-- Tab Contents -->
    <div class="p-6 space-y-4">
      
      <!-- DRAW TAB -->
      <div *ngIf="activeTab === 'draw'" class="space-y-3">
        <div class="relative w-full h-44 rounded-2xl border-2 border-dashed overflow-hidden flex items-center justify-center bg-white cursor-crosshair shadow-inner"
          [ngClass]="darkMode ? 'border-slate-700' : 'border-slate-300'">
          <canvas 
            #sigCanvas
            (mousedown)="onMouseDown($event)"
            (mousemove)="onMouseMove($event)"
            (mouseup)="onMouseUp()"
            (mouseleave)="onMouseUp()"
            class="w-full h-full block">
          </canvas>
        </div>

        <div class="flex items-center justify-between">
          <!-- Signature Colors -->
          <div class="flex items-center space-x-2">
            <span class="text-xs font-bold text-slate-500">Ink:</span>
            <button
              *ngFor="let color of sigColors"
              (click)="sigColor = color"
              class="w-6 h-6 rounded-full border-2 transition-transform hover:scale-110"
              [style.backgroundColor]="color"
              [ngClass]="sigColor === color ? 'border-indigo-600 ring-2 ring-indigo-500/30' : 'border-transparent'">
            </button>
          </div>

          <button 
            (click)="clearCanvas()"
            class="px-3 py-1 text-xs font-semibold text-slate-500 hover:text-rose-600 transition-colors flex items-center gap-1">
            <i nz-icon nzType="clear" nzTheme="outline"></i>
            <span>Clear</span>
          </button>
        </div>
      </div>

      <!-- TYPE TAB -->
      <div *ngIf="activeTab === 'type'" class="space-y-4">
        <div class="space-y-1">
          <label class="text-xs font-bold text-slate-600 dark:text-slate-400">Your Full Name</label>
          <input 
            type="text" 
            [(ngModel)]="typedText"
            placeholder="e.g. Alex Taylor"
            class="w-full p-2.5 text-xs rounded-xl border bg-white dark:bg-slate-800 text-slate-900 dark:text-white border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/20" />
        </div>

        <div class="space-y-2">
          <label class="text-xs font-bold text-slate-600 dark:text-slate-400">Select Signature Style</label>
          <div class="grid grid-cols-2 gap-2.5">
            <button
              *ngFor="let font of fonts"
              (click)="selectedFont = font.style"
              class="p-3.5 rounded-2xl border text-center transition-all"
              [ngClass]="selectedFont === font.style 
                ? 'border-indigo-600 bg-indigo-50/50 dark:bg-indigo-950/50 ring-2 ring-indigo-500/20' 
                : (darkMode ? 'border-slate-800 bg-slate-800/60 hover:border-slate-700' : 'border-slate-200 bg-white hover:border-slate-300')">
              <span class="text-2xl block text-slate-900 dark:text-white" [style.font-family]="font.style">
                {{ typedText || 'Signature' }}
              </span>
              <span class="text-[10px] text-slate-400 mt-1 block">{{ font.name }}</span>
            </button>
          </div>
        </div>
      </div>

      <!-- UPLOAD TAB -->
      <div *ngIf="activeTab === 'upload'" class="space-y-3">
        <div class="relative w-full h-44 rounded-2xl border-2 border-dashed flex flex-col items-center justify-center p-6 text-center cursor-pointer transition-colors"
          [ngClass]="darkMode ? 'border-slate-700 bg-slate-800/40 hover:border-indigo-500' : 'border-slate-300 bg-slate-50 hover:border-indigo-600'">
          
          <input 
            type="file" 
            accept="image/png, image/jpeg"
            (change)="onImageUpload($event)"
            class="absolute inset-0 opacity-0 cursor-pointer" />

          <div *ngIf="!uploadedImage" class="flex flex-col items-center space-y-2 pointer-events-none">
            <div class="w-10 h-10 rounded-2xl bg-indigo-500/10 text-indigo-500 flex items-center justify-center">
              <i nz-icon nzType="cloud-upload" nzTheme="outline" class="text-xl"></i>
            </div>
            <p class="text-xs font-bold text-slate-700 dark:text-slate-300">Click to upload signature image</p>
            <p class="text-[10px] text-slate-400">PNG with transparent background recommended</p>
          </div>

          <img 
            *ngIf="uploadedImage" 
            [src]="uploadedImage" 
            alt="Uploaded signature" 
            class="max-h-full max-w-full object-contain pointer-events-none" />
        </div>
      </div>

    </div>

    <!-- Modal Footer -->
    <div class="h-16 px-6 flex items-center justify-end space-x-2.5 border-t shrink-0"
      [ngClass]="darkMode ? 'border-slate-800 bg-slate-900/50' : 'border-slate-100 bg-slate-50/50'">
      <button 
        (click)="onClose()"
        class="px-4 py-2 text-xs font-semibold rounded-xl text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-colors">
        Cancel
      </button>

      <button 
        (click)="onApply()"
        class="btn-primary px-5 py-2 text-xs font-bold rounded-xl shadow-md shadow-indigo-600/30">
        Insert Signature
      </button>
    </div>

  </div>
</div>
