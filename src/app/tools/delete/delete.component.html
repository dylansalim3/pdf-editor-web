<div class="h-full flex flex-col overflow-hidden bg-slate-100 dark:bg-[#0B0F19]">
  <!-- Top Tool Header -->
  <div class="bg-white dark:bg-slate-900 border-b border-slate-200/80 dark:border-slate-800/80 px-6 py-3.5 flex items-center justify-between shadow-xs z-20">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-xl bg-rose-50 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 flex items-center justify-center">
        <i nz-icon nzType="delete" class="text-base"></i>
      </div>
      <div>
        <h1 class="text-base font-bold text-slate-900 dark:text-white tracking-tight leading-tight font-display">Delete Pages</h1>
        <p class="text-[11px] text-slate-400">Prune single pages, ranges, or inverse selections</p>
      </div>
    </div>
    
    <div class="flex items-center space-x-2">
      <button (click)="onUndo()" class="btn-secondary px-3 py-1.5 text-xs font-semibold" title="Undo">
        <i nz-icon nzType="undo" nzTheme="outline" class="mr-1"></i> Undo
      </button>
      <button (click)="onRedo()" class="btn-secondary px-3 py-1.5 text-xs font-semibold" title="Redo">
        <i nz-icon nzType="redo" nzTheme="outline" class="mr-1"></i> Redo
      </button>
      <button (click)="onDownload()" class="btn-glow px-4 py-1.5 text-xs font-semibold">
        <i nz-icon nzType="download" nzTheme="outline" class="mr-1"></i> Download
      </button>
    </div>
  </div>

  <!-- Main Content Body -->
  <div class="flex-1 flex flex-col md:flex-row overflow-hidden min-h-0">
    <!-- PDF Viewer Canvas -->
    <div class="flex-1 bg-slate-900 relative overflow-hidden flex flex-col">
      <div *ngIf="loading" class="absolute inset-0 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center z-10">
        <div class="p-4 rounded-xl bg-slate-900 border border-slate-800 text-center shadow-xl space-y-2">
          <nz-spin nzSize="large"></nz-spin>
          <p class="text-xs font-medium text-slate-200">Removing pages...</p>
        </div>
      </div>
      
      <ngx-extended-pdf-viewer
        [src]="src"
        height="100%"
        [useBrowserLocale]="true"
        [showBookmarkButton]="false"
        [showDownloadButton]="false"
        [showPrintButton]="true"
        [showPropertiesButton]="false"
        [showOpenFileButton]="false"
        [showHandToolButton]="true"
        [showRotateButton]="false"
        [textLayer]="true"
        (pagesLoaded)="onPageLoaded($event)"
        (pageChange)="onCurrentPageChanged($event)">
      </ngx-extended-pdf-viewer>
    </div>

    <!-- Sidebar Controls -->
    <div class="w-full md:w-80 bg-white dark:bg-slate-900 border-l border-slate-200/80 dark:border-slate-800/80 flex flex-col overflow-y-auto scrollbar-thin z-10">
      <!-- Mode Selection -->
      <div class="p-4 border-b border-slate-100 dark:border-slate-800 space-y-3">
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Deletion Mode</h3>
        <nz-radio-group [(ngModel)]="deleteMode" class="flex flex-col space-y-2">
          <label nz-radio nzValue="single" class="text-xs text-slate-700 dark:text-slate-300 font-medium">
            <span>Single Page</span>
          </label>
          <label nz-radio nzValue="range" class="text-xs text-slate-700 dark:text-slate-300 font-medium">
            <span>Page Range</span>
          </label>
          <label nz-radio nzValue="multiple" class="text-xs text-slate-700 dark:text-slate-300 font-medium">
            <span>Multi-Page Selection</span>
          </label>
        </nz-radio-group>
      </div>

      <!-- Single Page Options -->
      <div class="p-4 border-b border-slate-100 dark:border-slate-800 space-y-2" *ngIf="deleteMode === 'single'">
        <label class="form-label">Page to Delete</label>
        <nz-input-number 
          [(ngModel)]="singlePage" 
          [nzMin]="1" 
          [nzMax]="maxPage"
          class="w-full">
        </nz-input-number>
        <p class="text-[11px] text-slate-400">Active page in viewer: Page {{ currentPage }}</p>
      </div>

      <!-- Page Range Options -->
      <div class="p-4 border-b border-slate-100 dark:border-slate-800 space-y-2" *ngIf="deleteMode === 'range'">
        <label class="form-label">Page Range</label>
        <div class="flex items-center space-x-2">
          <nz-input-number 
            [(ngModel)]="rangeStart" 
            [nzMin]="1" 
            [nzMax]="maxPage"
            class="flex-1">
          </nz-input-number>
          <span class="text-xs text-slate-400 font-medium">to</span>
          <nz-input-number 
            [(ngModel)]="rangeEnd" 
            [nzMin]="1" 
            [nzMax]="maxPage"
            class="flex-1">
          </nz-input-number>
        </div>
      </div>

      <!-- Multi-select Options -->
      <div class="p-4 border-b border-slate-100 dark:border-slate-800 space-y-3" *ngIf="deleteMode === 'multiple'">
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Selected Pages</h3>
          <span class="text-[11px] font-mono text-indigo-600 dark:text-indigo-400 font-semibold">{{ selectedPages.length }} chosen</span>
        </div>
        <button 
          (click)="keepOnlySelected()"
          [disabled]="selectedPages.length === 0"
          class="btn-secondary w-full py-2 text-xs font-semibold flex items-center justify-center gap-1.5">
          <i nz-icon nzType="filter" nzTheme="outline"></i> Keep Only Selected
        </button>
      </div>

      <!-- Thumbnails Selector -->
      <div class="p-4 border-b border-slate-100 dark:border-slate-800 space-y-3 flex-1">
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Pages ({{ maxPage }} Total)</h3>
        <div class="grid grid-cols-3 gap-2 max-h-64 overflow-y-auto scrollbar-thin p-1">
          <div 
            *ngFor="let page of [].constructor(maxPage); let i = index"
            (click)="deleteMode === 'multiple' ? togglePageSelection(i + 1) : singlePage = i + 1"
            class="relative aspect-[3/4] rounded-xl border-2 cursor-pointer transition-all duration-150 flex items-center justify-center group hover:border-rose-400 bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700"
            [class.border-rose-500]="isPageMarkedForDeletion(i + 1)"
            [class.tool-icon-rose]="isPageMarkedForDeletion(i + 1)"
            [class.border-indigo-500]="isPageSelected(i + 1) && !isPageMarkedForDeletion(i + 1)"
            [class.tool-icon-indigo]="isPageSelected(i + 1) && !isPageMarkedForDeletion(i + 1)">
            <span class="text-sm font-bold font-mono" [class.text-rose-600]="isPageMarkedForDeletion(i + 1)" [class.text-slate-500]="!isPageMarkedForDeletion(i + 1)">{{ i + 1 }}</span>
            <div *ngIf="isPageSelected(i + 1) || isPageMarkedForDeletion(i + 1)" class="absolute top-1 right-1">
              <i nz-icon [nzType]="isPageMarkedForDeletion(i + 1) ? 'close' : 'check'" nzTheme="outline" class="text-[10px]" [class.text-rose-500]="isPageMarkedForDeletion(i + 1)" [class.text-indigo-500]="isPageSelected(i + 1)"></i>
            </div>
          </div>

        </div>
      </div>

      <!-- Delete Action Button -->
      <div class="p-4 mt-auto">
        <button 
          (click)="onDelete()"
          [disabled]="loading"
          class="btn-danger w-full py-2.5 text-xs font-semibold flex items-center justify-center gap-1.5 shadow-sm">
          <i nz-icon nzType="delete" nzTheme="outline"></i>
          {{ loading ? 'Deleting...' : 'Delete Selected Pages' }}
        </button>
      </div>
    </div>
  </div>
</div>
