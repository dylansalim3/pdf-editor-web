<div class="h-full flex flex-col overflow-hidden bg-slate-100 dark:bg-[#0B0F19]">
  <!-- Top Tool Header -->
  <div class="bg-white dark:bg-slate-900 border-b border-slate-200/80 dark:border-slate-800/80 px-6 py-3.5 flex items-center justify-between shadow-xs z-20">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 flex items-center justify-center">
        <i nz-icon nzType="rotate-right" class="text-base"></i>
      </div>
      <div>
        <h1 class="text-base font-bold text-slate-900 dark:text-white tracking-tight leading-tight font-display">Rotate Pages</h1>
        <p class="text-[11px] text-slate-400">Reorient individual or all pages seamlessly</p>
      </div>
    </div>
    
    <div class="flex items-center space-x-2">
      <button (click)="onUndo()" class="btn-secondary px-3 py-1.5 text-xs font-semibold" title="Undo">
        <i nz-icon nzType="undo" nzTheme="outline" class="mr-1"></i> Undo
      </button>
      <button (click)="onRedo()" class="btn-secondary px-3 py-1.5 text-xs font-semibold" title="Redo">
        <i nz-icon nzType="redo" nzTheme="outline" class="mr-1"></i> Redo
      </button>
      <button (click)="onDownload()" class="btn-glow px-4 py-1.5 text-xs font-semibold">
        <i nz-icon nzType="download" nzTheme="outline" class="mr-1"></i> Download
      </button>
    </div>
  </div>

  <!-- Main Content Body -->
  <div class="flex-1 flex flex-col md:flex-row overflow-hidden min-h-0">
    <!-- PDF Viewer Canvas -->
    <div class="flex-1 bg-slate-900 relative overflow-hidden flex flex-col">
      <div *ngIf="loading" class="absolute inset-0 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center z-10">
        <div class="p-4 rounded-xl bg-slate-900 border border-slate-800 text-center shadow-xl space-y-2">
          <nz-spin nzSize="large"></nz-spin>
          <p class="text-xs font-medium text-slate-200">Applying rotation...</p>
        </div>
      </div>
      
      <ngx-extended-pdf-viewer
        [src]="src"
        height="100%"
        [useBrowserLocale]="true"
        [showBookmarkButton]="false"
        [showDownloadButton]="false"
        [showPrintButton]="true"
        [showPropertiesButton]="false"
        [showOpenFileButton]="false"
        [showHandToolButton]="true"
        [showRotateButton]="false"
        [textLayer]="true"
        (pagesLoaded)="onPageLoaded($event)"
        (pageChange)="onCurrentPageChanged($event)">
      </ngx-extended-pdf-viewer>
    </div>

    <!-- Sidebar Controls -->
    <div class="w-full md:w-80 bg-white dark:bg-slate-900 border-l border-slate-200/80 dark:border-slate-800/80 flex flex-col overflow-y-auto scrollbar-thin z-10">
      <!-- Quick Rotate -->
      <div class="p-4 border-b border-slate-100 dark:border-slate-800 space-y-3">
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Quick Actions</h3>
        <div class="grid grid-cols-3 gap-2">
          <button (click)="onRotateLeft()" class="btn-secondary flex flex-col items-center py-2.5 px-2 hover:border-indigo-300">
            <i nz-icon nzType="rotate-left" nzTheme="outline" class="text-lg text-indigo-600 dark:text-indigo-400 mb-1"></i>
            <span class="text-[11px] font-semibold">Left 90°</span>
          </button>
          <button (click)="onRotate180()" class="btn-secondary flex flex-col items-center py-2.5 px-2 hover:border-indigo-300">
            <i nz-icon nzType="sync" nzTheme="outline" class="text-lg text-indigo-600 dark:text-indigo-400 mb-1"></i>
            <span class="text-[11px] font-semibold">180° Flip</span>
          </button>
          <button (click)="onRotateRight()" class="btn-secondary flex flex-col items-center py-2.5 px-2 hover:border-indigo-300">
            <i nz-icon nzType="rotate-right" nzTheme="outline" class="text-lg text-indigo-600 dark:text-indigo-400 mb-1"></i>
            <span class="text-[11px] font-semibold">Right 90°</span>
          </button>
        </div>
      </div>

      <!-- Scope & Settings -->
      <div class="p-4 border-b border-slate-100 dark:border-slate-800 space-y-4">
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Target Selection</h3>
        
        <div>
          <nz-radio-group [(ngModel)]="rotationMode" class="flex flex-col space-y-2">
            <label nz-radio nzValue="current" class="text-xs text-slate-700 dark:text-slate-300 font-medium">
              <span>Active Page (Page {{ currentPage }})</span>
            </label>
            <label nz-radio nzValue="custom" class="text-xs text-slate-700 dark:text-slate-300 font-medium">
              <span>Specific Page Number</span>
            </label>
            <label nz-radio nzValue="all" class="text-xs text-slate-700 dark:text-slate-300 font-medium">
              <span>All Pages ({{ maxPage }} Total)</span>
            </label>
          </nz-radio-group>
        </div>

        <div *ngIf="rotationMode === 'custom'" class="pt-2">
          <label class="form-label">Page Number</label>
          <nz-input-number 
            [(ngModel)]="customPage" 
            [nzMin]="1" 
            [nzMax]="maxPage"
            class="w-full">
          </nz-input-number>
        </div>

        <div class="grid grid-cols-2 gap-2 pt-2">
          <div>
            <label class="form-label">Angle</label>
            <nz-select [(ngModel)]="rotationAngle" class="w-full text-xs">
              <nz-option [nzValue]="90" nzLabel="90°"></nz-option>
              <nz-option [nzValue]="180" nzLabel="180°"></nz-option>
              <nz-option [nzValue]="270" nzLabel="270°"></nz-option>
            </nz-select>
          </div>
          <div>
            <label class="form-label">Direction</label>
            <nz-select [(ngModel)]="direction" class="w-full text-xs">
              <nz-option nzValue="clockwise" nzLabel="Clockwise"></nz-option>
              <nz-option nzValue="counterclockwise" nzLabel="Counter-CW"></nz-option>
            </nz-select>
          </div>
        </div>

        <button 
          (click)="onRotate()"
          [disabled]="loading"
          class="btn-primary w-full py-2.5 text-xs font-semibold flex items-center justify-center gap-1.5 shadow-sm">
          <i nz-icon nzType="check" nzTheme="outline"></i> Apply Rotation
        </button>
      </div>

      <!-- Batch Multi-Select -->
      <div class="p-4 border-b border-slate-100 dark:border-slate-800 space-y-3">
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Batch Selection</h3>
          <span class="text-[11px] font-mono text-indigo-600 dark:text-indigo-400 font-semibold">
            {{ selectedPages.length }} chosen
          </span>
        </div>

        <button 
          (click)="onRotateSelected()"
          [disabled]="selectedPages.length === 0 || loading"
          class="btn-secondary w-full py-2 text-xs font-semibold flex items-center justify-center gap-1.5">
          <i nz-icon nzType="rotate-right" nzTheme="outline"></i> Rotate {{ selectedPages.length }} Selected
        </button>
      </div>

      <!-- Page Thumbnails Grid -->
      <div class="p-4 space-y-3 flex-1">
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Pages Grid</h3>
          <button 
            (click)="showThumbnails = !showThumbnails"
            class="text-[11px] font-semibold text-indigo-600 hover:text-indigo-700 dark:text-indigo-400">
            {{ showThumbnails ? 'Hide' : 'Show' }}
          </button>
        </div>

        <div *ngIf="showThumbnails" class="grid grid-cols-2 gap-2 max-h-64 overflow-y-auto scrollbar-thin p-1">
          <div 
            *ngFor="let page of [].constructor(maxPage); let i = index"
            (click)="togglePageSelection(i + 1)"
            class="relative aspect-[3/4] bg-slate-50 dark:bg-slate-800 rounded-xl border-2 cursor-pointer transition-all duration-150 flex flex-col items-center justify-center group hover:border-indigo-400"
            [class.border-indigo-600]="isPageSelected(i + 1)"
            [class.tool-icon-indigo]="isPageSelected(i + 1)"
            [class.border-slate-200]="!isPageSelected(i + 1)">
            <span class="text-base font-bold text-slate-500 group-hover:text-slate-900 dark:text-slate-400 dark:group-hover:text-white font-mono">{{ i + 1 }}</span>
            <div 
              *ngIf="isPageSelected(i + 1)"
              class="absolute top-1.5 right-1.5 w-4 h-4 bg-indigo-600 rounded-full flex items-center justify-center shadow-xs">
              <i nz-icon nzType="check" nzTheme="outline" class="text-white text-[10px]"></i>
            </div>
            <span class="absolute bottom-1.5 text-[10px] font-mono text-slate-400">
              {{ pageRotations[i]?.rotation || 0 }}°
            </span>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
